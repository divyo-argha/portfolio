<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The Q lifted from the cyQured wordmark: a round, even-weight bowl with a
       heavy swash tail sweeping out past the lower right. Redrawn geometrically
       rather than traced, because the wordmark's fine outline detail turns to
       mud at 16px. Cyan (#5ee1f2) and near-black are the game pages' own palette. -->
  <defs>
    <linearGradient id="cyqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2a34"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#cyqBg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#1b4e5c" stroke-width="1"/>

  <g fill="none" stroke="#5ee1f2" stroke-width="3.1" stroke-linecap="round">
    <circle cx="14.7" cy="13.7" r="6.9"/>
    <path d="M12.6 17.6 C15.4 21.1 18.9 23.4 23.2 24.7"/>
  </g>
</svg>
